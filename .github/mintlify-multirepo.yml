# Child repositories to aggregate into this Mintlify site.
# Each source is shallow-cloned, copied into its `destination` (which is also
# the URL prefix), and its `navigation` is merged over docs.base.json.
base: docs.base.json
output: docs.json
sources:
  - repo: AmazeContinuityProjects/AmazeCC
    path: docs
    destination: amazecc
  - repo: AmazeContinuityProjects/AmazeCC-Dashboard
    path: docs
    destination: amazecc-dashboard
  - repo: AmazeContinuityProjects/AmazeCC-API
    path: docs
    destination: amazecc-api
  - repo: AmazeContinuityProjects/AmazeCC-Club-Hub
    path: docs
    destination: amazecc-club-hub
    # docs/ only exists on modifs until PR #5 merges into main; drop this ref then
    ref: modifs
  - repo: AmazeContinuityProjects/landing
    path: docs
    destination: landing
